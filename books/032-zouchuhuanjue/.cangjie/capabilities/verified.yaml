    importance: critical
    importance_rationale: 唯一可自诊、可定位、可推进的五层阶梯；第六章专节＋第二章多个低层失败实例作反证；是所有后续干预的前置筛子。
    one_liner: 拒绝面对→规避→承认合理→盈亏同源→得失随缘；先定位自己在第几层，再决定下一步谈什么。
    intents:
      - 我现在算什么水平、交易境界到哪了
      - 我明明知道要止损但就是做不到
      - 怎么判断我是不是适合继续做交易
      - trading maturity levels, how to tell if I am a real trader
    keywords: [亏损五境界, 交易境界, 自诊, 成熟度, 接纳程度, trader maturity, accepting losses]
    also_read: []
    card: cards/loss-maturity-ladder.md
    frontmatter:
