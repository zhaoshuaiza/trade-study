  - capability_id: cap.032.never-open-without-signal
    revision: 1
    status: active
    aliases: []
    supersedes: []
    merged_into: null
    split_into: []
    slug: never-open-without-signal
    title: "永不非信号开仓——每笔都对应系统信号"
    importance: high
    importance_rationale: "一致性最可执行的落地闸门；第六章昆虫系统核心纪律，使潜在亏损落入系统既定分布，杜绝随手进场。"
    one_liner: "每笔开仓必须对应一个系统信号，使潜在亏损符合系统的亏损分布；无信号不开仓。"
    intents: ["盘中临时起意想加一笔", "怎么管住自己不随手追", "为什么必须等信号", "no signal no entry discipline"]
    keywords: ["非信号开仓", "随手进场", "信号", "一致性", "纪律"]
    also_read: []
    card: cards/never-open-without-signal.md
    frontmatter:
      description: |
        随手开仓会让亏损脱离系统可统计的分布，等于在系统外偷偷下注，长期必然侵蚀期望值。
