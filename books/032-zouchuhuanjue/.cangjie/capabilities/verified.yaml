        用户想知道自己处于什么交易层级、为何道理都懂却做不到、或在问"我适不适合做交易"时使用；
        也用于在任何深层干预前先做层级定位。
        信号：「我是不是不适合做交易」「道理都懂做不到」「怎么才算成熟」「我这水平还差多少」。
        不适用：层级已在第③层以上且具体问参数/优化（转 avoid-over-optimization）；
