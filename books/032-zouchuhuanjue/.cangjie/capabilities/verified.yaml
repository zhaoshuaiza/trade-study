entry:
  name: zouchuhuanjue
  description: |
    用于《走出幻觉·走向成熟》（金融帝国）体系内的交易认知与系统建设咨询。
    当用户表达对亏损的恐惧或纠结（怕止损、套牢不敢看、连续亏想改方法）、
    纠结于胜率与赔率的参数优化、想要一个能长期执行的趋势跟踪系统、
    或重复切换方法却始终原地打转时使用。
    不适用于：个股/板块的涨跌预测、选股推荐、基本面财报解读、短线盘口打板、以及任何索要确定的买卖点位。
  core_principles:
    - 亏损不是错误，是获取趋势利润必须垫付的进货成本；规避亏损必然同时规避利润（盈亏同源）。
    - 对未来每一笔的恐惧源于索要确定性；接受不确定性后，盈亏便从道德问题降级为成本问题。
    - 让盈利之所以可能的结构是：低正确率＋大赔率＋一致性执行，而不是高胜率与精准预测。
    - 评价一笔交易的对错只能基于它是否符合系统，不能基于它的盈亏结果。
    - 系统不需要最优，需要能在大样本中重复执行；参数两端等效，早定下来的家才是好家。
    - 最高境界不是预测更准，而是能与必要的亏损共处，并对它心怀感激。
  out_of_scope:
    - 具体个股、板块、转债的买卖推荐与点位预测
    - 基本面财报分析、估值建模、宏观政策解读
    - 短线打板、龙虎榜、盘口分时博弈类游资战法
    - 期货双向/日内回转策略（作者在期货验证本书体系，但当前用途限于股票与可转债的单向多头）
    - 保证收益、确定盈利、以及任何消除亏损的承诺
  stop_conditions:
    - 用户索要确定的涨跌判断或具体标的 → 明确告知超出本书范围，不要硬套趋势跟踪语言去预测
    - 用户尚处于"拒绝面对亏损"阶段（第①层） → 不要谈参数优化与系统开发，先做亏损诊断
    - 无仓位计划、无固定止损、无重复执行样本 → 不进入系统有效性讨论，先补足这三项
    - 用户要求把多种方法叠加或持续加过滤器 → 先过"优化与组合陷阱"再决定
router_entry:
  name: zouchuhuanjue
  description: |
    《走出幻觉·走向成熟》（金融帝国）的来源路由入口。以下场景直接问它：
    纠结亏损止损用语与心理建设、判断自己对亏损处于哪个认知层级、
    厘清真正的风险防范该做什么、判断该不该优化参数或叠加策略、
    要一套可直接落地的分散趋势跟踪系统、解释为何高胜率却在亏钱、
    以及识别自己是不是在反复更换方法的"狗咬尾巴"循环里。
    更高频的独立意图已晋级为独立 Skill，可直接调用。
promotion_budget: 8
capabilities:
  - capability_id: cap.032.loss-as-cost
    revision: 1
    status: active
    aliases: []
    supersedes: []
    merged_into: null
    split_into: []
    slug: trading-loss-as-cost
    title: 盈亏同源——把亏损当进货成本
    importance: critical
    importance_rationale: 全书心理基石；第六章核心概念，被「亏损五境界」「一致性」「风险防范两点」等多处引用；任何止损、持仓、风控类能力都依赖此词不被误读为「亏损等于做错」。
    one_liner: 亏损不是做错的证明，而是获取趋势利润必须垫付的进货成本——规避亏损必然同时规避利润。
    intents:
      - 亏损了要不要止损、怎么面对
      - 一亏钱就难受、不敢看账户怎么办
      - 如何正确看待交易亏损
      - stop loss psychology, how to accept trading losses
    keywords: [亏损, 成本, 止损, 盈亏同源, 接纳亏损, trading loss, stop loss, cost of doing business]
    also_read: []
    card: cards/trading-loss-as-cost.md
    frontmatter:
      description: |
        用户表达对亏损的恐惧、痛苦与抗拒，或在止损前后反复纠结"我是不是做错了"时使用；
        也用于纠正"少亏就是好事""严格止损的目的是减少亏损"这类误解。
        信号：「亏怕了」「不敢止损」「一亏就睡不着」「止损到底对不对」「这单亏了说明方法不行」。
        不适用：已经接纳亏损、转而讨论参数或系统优化的（转 optimization-trap）；
        索要具体点位止损数值预测的（超出本书范围）。
      tags: [trading-psychology, risk-acceptance, cost-mindset]
    source_evidence:
      - source_id: src-main-book
        location: 第六章 系统之路 · 成本观与盈亏同源
    promotion:
      destination: promoted
      gate:
        independent_intent: true
        independent_contract: true
        independent_run: true
        independent_reuse: true
        independent_eval: true
      notes: 用户不提书名也会单独问"怎么面对亏损"；有明确输入（近期亏损事件）与输出（重新叙事＋成本化动作）。

  - capability_id: cap.032.loss-maturity-ladder
