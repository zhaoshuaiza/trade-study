        location: 第六章 系统之路 · 风险防范
    promotion:
      destination: promoted
      gate:
        independent_intent: true
        independent_contract: true
        independent_run: true
        independent_reuse: true
        independent_eval: true
      notes: 「怎么控风险」是极高频独立提问；输出含可验证的两条检查项与明确的负向断言，与相邻的风控类意图区分清晰。

  - capability_id: cap.032.avoid-over-optimization
    revision: 1
    status: active
    aliases: []
    supersedes: []
    merged_into: null
    split_into: []
    slug: avoid-over-optimization
    title: 优化与组合陷阱——不要折腾参数和叠加策略
    importance: critical
    importance_rationale: 第二章多个原理（小蝴蝶/损耗/超级掠食者）与第六章专节共同指向；是"为什么别再调参"的唯一论证核心，入度最高。
    one_liner: 参数两端等效、方法叠加会把劣势一起叠加；给跟踪尺度找个固定的家，别再把利润调没了。
    intents:
      - 参数怎么设最好、要不要再优化一下
      - 要不要加个过滤条件提高胜率
      - 能不能把两个方法组合在一起
      - overfitting, parameter optimization, combine trading strategies, add filters
    keywords: [优化陷阱, 过度拟合, 参数, 组合, 过滤器, 叠加, 等效性, overfitting, optimization, combine strategies]
    also_read: []
    card: cards/avoid-over-optimization.md
    frontmatter:
      description: |
        用户想进一步调参、加过滤条件、叠加验证维度、或把多种方法组合起来"让它更稳"时使用；
        也用于解释为何回测很漂亮实盘却崩。信号：「参数怎么设最好」「再加一个条件过滤」
        「两个策略组合是不是更强」「回测很好实盘不行」「要不要换个更敏感的均线」。
        不适用：连一套固定规则都还没有的新手（先建立一致性，转 loss-maturity-ladder）；
        纯问某个指标怎么计算。
      tags: [system-design, overfitting, simplicity]
    source_evidence:
      - source_id: src-main-book
        location: 第六章 系统之路 · 优化与组合
    promotion:
      destination: promoted
      gate:
        independent_intent: true
        independent_contract: true
        independent_run: true
        independent_reuse: true
        independent_eval: true
      notes: 「要不要再优化」是最高频独立意图之一；可写出明确的负向近邻用例（对比追求双高、对比组合多策略），断言清晰。

