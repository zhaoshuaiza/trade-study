  - capability_id: cap.032.risk-two-points
    revision: 1
    status: active
    aliases: []
    supersedes: []
    merged_into: null
    split_into: []
    slug: risk-guard-two-points
    title: 风险防范只有两点——保住位置与绝对止损
    importance: high
    importance_rationale: 直接否定"分散=避险""买优质=避险"两大主流常识；第六章风控节＋第七章明确切割，反例证据多（ce05/ce19/ce22）。
    one_liner: 真正的风险防范只有两条：守住趋势中的位置，以及给每笔一个绝对止损点；分散和买好公司都不是。
    intents:
      - 怎么做风险控制、如何防范风险
      - 持仓回撤了要不要先出来
      - 分散持股能不能降低风险
      - risk management trading, how to protect capital, does diversification reduce risk
    keywords: [风险防范, 止损点, 持仓, 保住位置, 分散, 风险控制, risk management, position, stop loss]
    also_read: []
    card: cards/risk-guard-two-points.md
    frontmatter:
      description: |
        用户问风险控制该怎么做、纠结要不要因回撤先离场、或把"多买几只/买好公司/买便宜"
        当成风险防范时使用。信号：「怎么控制风险」「回撤了要不要先跑」「分散能降低风险吗」
        「多买几只稳一点」「买龙头是不是更安全」。
        不适用：问具体止损价设在哪个数值（本书不给参数，给的是"必须有绝对止损点"这一结构要求）；
        问个股是否该买按主板分析的（超出范围）。
      tags: [risk-management, stop-loss, position-keeping]
    source_evidence:
