  <h2 class="secondTitle" id="heading_id_2">小结</h2>

  <p class="content">我们刚刚看到了所有57项最佳实践。其中有一些会更适合你，但无论如何你都能找到几个真正有利于你交易的方法。以下是一些关于全部实践的想法。</p>

  <p class="kaiti">(1)<span class="bold">找到共同的主题。</span>ass="kaiti">(3)<span class="bold">不要只专注于缺点，优点也很重要。</span>如果这本书只有一个最重要的主题，那就是成功取决于你如何识别并利用自己的优势。一些最佳实践的确可以弥补你的弱点，帮你规避失误，而<span class="bold">最好</span>的实践能够发挥你的优势。</p>

  <p class="content">作为一名交易员，你的发展历程就像是一次探险。一点一滴秎W的进步，能让你越来越接近自己的理想状态。没有自我提升，就没有交易中的进步。想做好交易，就要先做好你自己——这才是一段无比充实的经历。</p>
