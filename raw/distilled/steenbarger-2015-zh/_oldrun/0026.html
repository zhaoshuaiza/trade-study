  <h2 class="secondTitle" id="heading_id_2">创造力最主要的能量之源</h2>

  <p class="content">正如我之前提到的，多年来与交易员的共事中最让我印象深刻的是，他们很多人都缺乏独特的、独立的、批判性的思维。很多时候，交易员们不去花时间来验证结论，就武断地认为一份研究报告是准确合理的。他们不做回测，就直接地去判断市场情绪。交易员们相互抄袭交易策略，担心错失良机，而他们的同行反而可能会利用这些机会。所有这些缺点的结果就是群体思维，久而久之，大多数人都会持有相似的观点和交易策略。</p>
