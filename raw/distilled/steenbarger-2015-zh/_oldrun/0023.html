  <h2 class="secondTitle" id="heading_id_2">创造力与生活方式</h2>

  <p class="content">如果你每天都在重夷着相同的事情，就很难拥有创造性的生活了。关于日常习惯，有几点是十分值得讨论的，因为对习惯的依赖让我们有机会在生活中迎接新的挑战。然而，当生活变得仅由一系列日常习惯组成的时候，我们又该从哪里汲取灵感，以崭新的、充满阳光的方式应对生活中的挑战呢？</p>

  <p class="content">许多年来，我一直都认为在日常生活中嵌入一些创造力的元素是很重要的。如果我不去阅k，不与陌生人交谈，不关注新事物或不去开发新的研究方向，我将会很难俓y大脑的兴奋，也就不利于我创造性地审视市场，看待我</html>
